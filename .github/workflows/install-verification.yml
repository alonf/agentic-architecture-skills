# Installs the package on both hosts inside a clean container, on the GitHub runner, using the same
# script a maintainer runs locally: eng/Test-Install.ps1. It answers SC-001 - a clean machine installs
# the package from the README alone in under a minute per host - against the tree just pushed, and keeps
# the recorded run as a workflow artifact.
#
# This is deliberately a separate workflow from validate.yml. The validation runner is the single
# definition of "the package is valid" and runs on every push; this one exercises the hosts and needs
# Docker and a token, so it runs on main and on demand.

name: install-verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install on both hosts in a clean container
        env:
          # Read access to this repository, so the hosts can clone it while it is private.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The record goes to a path outside the checkout: the tree already holds committed PASS records,
        # and uploading a glob over them would present an old PASS as this run's evidence.
        # The triggering commit is the expectation: the hosts clone the default branch and take no ref,
        # so without it a push that lands mid-run, or a workflow_dispatch on another ref, could pass on
        # content this checkout never contained. The driver fails a blocking path whose installed
        # revision or content digest differs from this checkout.
        run: pwsh -File ./eng/Test-Install.ps1 -Source "${{ github.repository }}" -ExpectedRevision "${{ github.sha }}" -OutputPath "$RUNNER_TEMP/install-verification/current-run.md"

      - name: Keep this run's record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-verification
          path: ${{ runner.temp }}/install-verification/current-run.md
          # The driver writes a record even when it fails; a missing file means it never ran at all.
          if-no-files-found: error
